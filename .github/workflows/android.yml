name: Build Android debug APK
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm install
      - run: mkdir -p www && cp index.html www/index.html
      - name: Use test ads in debug builds
        run: sed -i 's/const ADS={test:false/const ADS={test:true/' www/index.html
      - run: npx cap add android
      - name: Add AdMob app ID
        run: |
          ID="ca-app-pub-2701121470969867~7752984934"
          sed -i "s#</application>#<meta-data android:name=\"com.google.android.gms.ads.APPLICATION_ID\" android:value=\"$ID\"/></application>#" android/app/src/main/AndroidManifest.xml
      - run: npx cap sync android
      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: studyconnect-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
