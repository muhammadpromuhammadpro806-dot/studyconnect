<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>StudyConnect</title>
<style>
:root{--pri:#2563eb;--pri2:#1d4ed8;--soft:#e8f0fe;--bg:#f5f7fb;--card:#fff;--tx:#0f172a;--mut:#64748b;--bd:#e5e9f2;--sh:0 2px 12px rgba(15,23,42,.06);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--pri:#60a5fa;--pri2:#3b82f6;--soft:#172554;--bg:#0b1220;--card:#131c2e;--tx:#e8eefc;--mut:#94a3b8;--bd:#223049;--sh:none}}
:root[data-theme="dark"]{--pri:#60a5fa;--pri2:#3b82f6;--soft:#172554;--bg:#0b1220;--card:#131c2e;--tx:#e8eefc;--mut:#94a3b8;--bd:#223049;--sh:none}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}body{background:var(--bg);color:var(--tx);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input,textarea,select{font:inherit;color:var(--tx);background:var(--bg);border:1px solid var(--bd);border-radius:12px;padding:11px 12px;width:100%;outline:0;margin-bottom:10px}
input:focus,textarea:focus{border-color:var(--pri)}
#app{display:flex;flex-direction:column;height:100%;max-width:640px;margin:0 auto}
header{display:flex;align-items:center;gap:10px;padding:12px 16px 6px}
.logo{width:38px;height:38px;border-radius:12px;background:linear-gradient(135deg,var(--pri),var(--pri2));display:grid;place-items:center;color:#fff;font-size:20px}
.brand b{display:block;font-size:18px}.brand small{color:var(--mut);font-size:11px}.sp{flex:1}
.ib{width:40px;height:40px;border-radius:12px;background:var(--card);border:1px solid var(--bd);display:grid;place-items:center;font-size:18px}
main{flex:1;overflow-y:auto;padding:8px 16px 20px}
.seg{display:flex;gap:4px;padding:4px;background:var(--card);border:1px solid var(--bd);border-radius:16px;margin-bottom:14px;position:sticky;top:0;z-index:2}
.seg button{flex:1;padding:9px 4px;border-radius:12px;font-weight:600;color:var(--mut);transition:.2s}
.seg button.on{background:var(--pri);color:#fff;box-shadow:0 4px 12px rgba(37,99,235,.3)}
.card{background:var(--card);border:1px solid var(--bd);border-radius:18px;padding:14px;margin-bottom:12px;box-shadow:var(--sh);animation:up .3s ease both}
@keyframes up{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
h2{font-size:17px;margin:6px 2px 10px}.row{display:flex;align-items:center;gap:12px}
.av{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:700;flex:none}
.av.lg{width:84px;height:84px;font-size:30px;border:4px solid var(--card);box-shadow:0 0 0 2px var(--pri)}
.grow{flex:1;min-width:0}.grow b,.grow p{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.mut{color:var(--mut);font-size:13px}
.chip{display:inline-block;padding:4px 10px;border-radius:99px;background:var(--soft);color:var(--pri);font-size:12px;font-weight:600;margin:6px 6px 0 0}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:10px;scrollbar-width:none}.chips .chip{margin:0;white-space:nowrap}.chips .chip.on{background:var(--pri);color:#fff}
.btn{padding:9px 16px;border-radius:12px;background:var(--pri);color:#fff;font-weight:600;font-size:14px}.btn:active,.ib:active{transform:scale(.95)}
.btn.o{background:var(--soft);color:var(--pri)}.btn.big{width:100%;padding:13px;margin-bottom:12px}.btn.red{background:#fee2e2;color:#b91c1c}
.acts{display:flex;gap:16px;margin-top:10px;color:var(--mut);font-size:14px}.acts .liked{color:#e11d48}
.dots{display:flex;gap:4px;margin-top:8px}.dots i{width:22px;height:6px;border-radius:9px;background:var(--bd)}.dots i.f{background:var(--pri)}
.hero{background:linear-gradient(135deg,var(--pri),#7c3aed);color:#fff;border-radius:22px;padding:18px;margin-bottom:14px}.hero p{opacity:.9;font-size:13px;margin:4px 0 12px}.hero .btn{background:#fff;color:#1d4ed8}
.stats{display:flex;gap:10px;margin-top:14px}.stats div{flex:1;text-align:center;padding:10px;background:var(--bg);border-radius:14px}.stats b{display:block;font-size:18px}
.nav{display:flex;background:var(--card);border-top:1px solid var(--bd);padding:6px 6px 8px}
.nav button{flex:1;display:flex;flex-direction:column;align-items:center;font-size:11px;color:var(--mut);padding:4px}
.nav button span{font-size:20px;padding:2px 16px;border-radius:99px;transition:.2s}.nav button.on{color:var(--pri);font-weight:700}.nav button.on span{background:var(--soft)}
.scrim{position:fixed;inset:0;background:rgba(2,6,23,.5);opacity:0;pointer-events:none;transition:.25s;z-index:10}.scrim.on{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;bottom:0;right:0;width:min(300px,82%);background:var(--card);z-index:11;transform:translateX(100%);transition:.28s;padding:calc(env(safe-area-inset-top,0px) + 18px) 14px 18px;overflow-y:auto}.drawer.on{transform:none}
.drawer>button{display:flex;gap:14px;align-items:center;padding:13px 12px;border-radius:12px;width:100%}.drawer>button:active{background:var(--soft)}
.sheet{position:fixed;left:0;right:0;bottom:0;max-width:640px;margin:0 auto;max-height:88%;overflow-y:auto;background:var(--card);border-radius:24px 24px 0 0;z-index:13;padding:20px 16px calc(env(safe-area-inset-bottom,0px) + 20px);transform:translateY(105%);transition:.3s}.sheet.on{transform:none}
.sheet h2{margin-top:0}.sheet label{display:flex;gap:10px;align-items:center;padding:8px 0}.sheet label input{width:auto;margin:0}
#chat{position:fixed;inset:0;background:var(--bg);z-index:12;display:none;flex-direction:column;max-width:640px;margin:0 auto;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}#chat.on{display:flex}
#msgs{flex:1;overflow-y:auto;padding:12px 16px;display:flex;flex-direction:column;gap:6px}
.m{max-width:78%;padding:9px 13px;border-radius:18px;background:var(--card);border:1px solid var(--bd);word-wrap:break-word}.m small{display:block;font-size:10px;opacity:.65;margin-top:2px}
.m.me{align-self:flex-end;background:var(--pri);color:#fff;border-color:var(--pri)}.m.me small{text-align:right}
.cin{display:flex;gap:8px;padding:10px 12px;background:var(--card);border-top:1px solid var(--bd)}.cin input{margin:0;border-radius:99px}
.toast{position:fixed;left:50%;bottom:90px;transform:translate(-50%,20px);background:var(--tx);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:13px;opacity:0;transition:.25s;z-index:30;max-width:90%;text-align:center;pointer-events:none}.toast.on{opacity:1;transform:translate(-50%,0)}
.ad{height:50px;border:1px dashed var(--bd);border-radius:12px;display:grid;place-items:center;color:var(--mut);font-size:12px;margin-bottom:12px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.m small button{font-size:11px;margin-left:6px}</style></head>
<body>
<div id="app"><header><div class="logo">🎓</div><div class="brand"><b>StudyConnect</b><small>Connect. Learn. Grow. Together.</small></div><div class="sp"></div><button class="ib" id="bellb" data-m="notif" aria-label="Notifications">🔔</button><button class="ib" id="menuBtn" aria-label="Menu">☰</button></header>
<main id="view"></main><nav class="nav" id="nav"></nav></div>
<div id="chat"></div><div class="scrim" id="scrim"></div><aside class="drawer" id="drawer"></aside><div class="sheet" id="sheet"></div><div class="toast" id="toast"></div>
<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import{getAuth,onAuthStateChanged,createUserWithEmailAndPassword,signInWithEmailAndPassword,sendPasswordResetEmail,signOut,deleteUser}from"https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import{getFirestore,doc,getDoc,setDoc,updateDoc,deleteDoc,addDoc,collection,query,where,orderBy,limit,onSnapshot,serverTimestamp,writeBatch,getDocs,Timestamp,arrayUnion,arrayRemove}from"https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
const fb=initializeApp({apiKey:"AIzaSyDMkFXqe0UXXbM3RpgWe_ihyZ_c_3z592M",authDomain:"studyconnect-13a75.firebaseapp.com",projectId:"studyconnect-13a75",storageBucket:"studyconnect-13a75.firebasestorage.app",messagingSenderId:"1073111507217",appId:"1:1073111507217:web:f6489e93aaa8445beeecb0"});
const auth=getAuth(fb),fs=getFirestore(fb);
let U=null,blocks=[],chatMsgs={},rp=null,found=null,ctx=null,unread={},gOut=[],chatUn=[],chatsKey="",posts=[],feedN=30,unFeed=null,unCm=null,cmts={},groups=[],gInv=[],joined=[],people=[],reqIn=[],reqOut=[],friends=[],ready=false,unsubs=[],unChat=null,mode="up";
// ===== Local data (feed/communities/theme only). Accounts, friends and chats live in Firebase. =====
const S=[{n:"Aisha Khan",u:"aisha_k",c:"🇵🇰 Pakistan",l:"A Level",s:["Physics","Maths"]},{n:"Liam Chen",u:"liamc",c:"🇸🇬 Singapore",l:"University",s:["Programming","CS"]},{n:"Sofia Rossi",u:"sofiar",c:"🇮🇹 Italy",l:"College",s:["Biology","English"]},{n:"Omar Hassan",u:"omarh",c:"🇪🇬 Egypt",l:"O Level",s:["Chemistry","Maths"]},{n:"Priya Nair",u:"priyan",c:"🇮🇳 India",l:"University",s:["Maths","Programming"]}];
const SUBJ=["Maths","Physics","Biology","Programming","English","Chemistry"];
const COM=["Mathematics","Physics","Biology","English","Computer Science","O Level Prep","A Level Prep","University Entrance"];
const now=Date.now();
const seed=()=>({me:null,friends:[],blocked:[],joined:["Mathematics"],liked:[],groups:[],chats:{},nid:10,posts:[
{id:1,a:0,t:"Quick tip: practise past papers under timed conditions. It improves speed far more than rereading notes.",sub:"Physics",ts:now-720000,lk:24},
{id:2,a:1,t:"Looking for a study partner to learn JavaScript algorithms. Beginners welcome!",sub:"Programming",ts:now-3600000,lk:18},
{id:3,a:2,t:"How do you remember the stages of mitosis? Share your tricks 🧬",sub:"Biology",ts:now-10800000,lk:31}]});
let db;try{db=JSON.parse(localStorage.getItem("sc-db"))||seed()}catch(e){db=seed()}db.me=null;
const save=()=>{try{localStorage.setItem("sc-db",JSON.stringify({...db,me:null}))}catch(e){}};
// ===== Helpers =====
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const cols=["#2563eb","#7c3aed","#db2777","#ea580c","#059669","#0891b2"];
const ini=n=>n.split(" ").map(w=>w[0]).join("").slice(0,2).toUpperCase();
const av=(n,k="")=>`<div class="av ${k}" style="background:${cols[n.length%6]}">${esc(ini(n))}</div>`;
const ago=t=>{const m=Math.round((Date.now()-t)/60000);return m<1?"now":m<60?m+"m":m<1440?Math.round(m/60)+"h":Math.round(m/1440)+"d"};
const hm=t=>new Date(t).toLocaleTimeString([],{hour:"2-digit",minute:"2-digit"});
function toast(m){const t=$("toast");t.textContent=m;t.classList.add("on");clearTimeout(toast.h);toast.h=setTimeout(()=>t.classList.remove("on"),2400)}
const later=s=>toast(s+" needs Firebase (coming later)");
let page="home",tab="global",fsub="All",q="",chatKey=null,locked=false;
// ===== Components =====
const ad=()=>`<div class="ad">Ad space · test banner placeholder</div>`;
const isF=u=>friends.some(f=>f.uid===u);
const stu=p=>{const f=isF(p.uid),out=reqOut.find(r=>r.to===p.uid&&r.status==="pending"),inn=reqIn.find(r=>r.from===p.uid&&r.status==="pending");
const b=f?`<button class="btn o" data-chat="${p.uid}">Message</button>`:inn?`<button class="btn" data-accept="${inn.id}">Accept</button>`:out?`<button class="btn o" disabled>Requested</button>`:`<button class="btn o" data-add="${p.uid}">+ Add</button>`;
return `<div class="card"><div class="row">${av(p.name)}<div class="grow"><b>${esc(p.name)}</b><span class="mut">@${esc(p.username)}${p.country?" · "+esc(p.country):""}</span></div>${b}<button class="ib" style="width:34px;height:34px" data-ua="${p.uid}" aria-label="More">⋮</button></div>${p.bio?`<p class="mut" style="margin-top:8px">${esc(p.bio)}</p>`:""}</div>`};
const post=p=>{const mine=p.from===U.uid,n=mine?db.me.name:nm(p.from),lk=(p.likedBy||[]).includes(U.uid);return `<div class="card"><div class="row">${av(n)}<div class="grow"><b>${esc(n)}</b><span class="mut">${p.createdAt?ago(p.createdAt.toMillis()):"now"} · ⏳ ${p.expireAt?Math.max(1,Math.ceil((p.expireAt.toMillis()-Date.now())/36e5)):24}h left${p.edited?" · edited":""}</span></div><span class="chip" style="margin:0">${esc(p.sub)}</span></div><p style="margin-top:10px">${esc(p.text)}</p><div class="acts"><button data-like="${p.id}" class="${lk?"liked":""}">${lk?"♥":"♡"} ${(p.likedBy||[]).length}</button><button data-cm="${p.id}">💬 Comments</button>${mine?`<button data-editp="${p.id}">✏️ Edit</button><button data-delp="${p.id}">🗑 Delete</button>`:`<button data-rep="${p.id}">⚑ Report</button><button data-bu="${p.from}">⛔ Block</button>`}</div></div>`};
const gname=i=>i==="me"?"You":S[i].n;
const cid=c=>c.toLowerCase().replace(/[^a-z0-9]+/g,"-");
const grp=g=>`<div class="card"><div class="row"><div class="av" style="background:${cols[g.name.length%6]};border-radius:14px">👥</div><div class="grow"><b>${esc(g.name)}${unread[g.id]?" 🔵":""}</b><span class="mut">${esc(g.sub)} · ${g.members.length}/5 members</span></div><button class="btn o" data-og="${g.id}">Open</button></div><div class="dots">${[0,1,2,3,4].map(i=>`<i class="${i<g.members.length?"f":""}"></i>`).join("")}</div></div>`;
const invCards=()=>gInv.filter(v=>v.status==="pending"&&vis(v.from)).map(v=>`<div class="card row"><div class="grow"><b>${esc(v.groupName)}</b><span class="mut">Invited by ${esc(v.fromName)}</span></div><button class="btn" data-accinv="${v.id}">Join</button><button class="btn o" data-decinv="${v.id}">✕</button></div>`).join("");
const comCard=c=>{const j=joined.includes(cid(c));return `<div class="card row" data-oc="${c}"><div class="av" style="background:${cols[c.length%6]};border-radius:14px">📘</div><div class="grow"><b>${c}</b><span class="mut">${j?"You joined · tap to open":"Public community"}</span></div>${j?`<button class="btn" data-oc="${c}">Open</button>`:`<button class="btn o" data-join="${c}">Join</button>`}</div>`};
const profileCard=()=>{const m=db.me;return `<div class="card" style="text-align:center"><div style="display:grid;place-items:center">${av(m.name,"lg")}</div><h2 style="margin:10px 0 0">${esc(m.name)}</h2><p class="mut">@${esc(m.user)}${m.country?" · "+esc(m.country):""}</p><p style="margin:8px 0">${esc(m.bio||"No bio yet")}</p><div class="stats"><div><b>${friends.length}</b><span class="mut">Friends</span></div><div><b>${groups.length}</b><span class="mut">Groups</span></div><div><b>${posts.filter(p=>p.from===U.uid).length}</b><span class="mut">Posts</span></div></div><button class="btn big" style="margin-top:14px" data-edit>Edit profile</button></div>`};
const visible=()=>posts.filter(p=>vis(p.from)&&p.expireAt&&p.expireAt.toMillis()>Date.now()&&(fsub==="All"||p.sub===fsub));
const tabs={
global:()=>`<div class="hero"><h1>Study together, worldwide 🌍</h1><p>Find partners by subject, country and level.</p><button class="btn" data-go="discover">Discover students</button></div>${ad()}
<div class="card"><textarea id="pt" rows="2" maxlength="500" placeholder="Share a study tip or question…" style="margin-bottom:8px"></textarea><div class="row"><select id="ps" style="margin:0">${SUBJ.map(s=>`<option>${s}</option>`).join("")}</select><button class="btn" data-post>Post</button></div></div>
<h2>Suggested study partners</h2>${people.filter(p=>!isF(p.uid)&&vis(p.uid)).slice(0,2).map(stu).join("")||`<div class="card mut">No suggestions right now.</div>`}
<h2>Global feed</h2><div class="chips">${["All",...SUBJ].map(x=>`<button class="chip ${x===fsub?"on":""}" data-f="${x}">${x}</button>`).join("")}</div>${visible().map(post).join("")||`<div class="card mut">No posts yet. Be the first to share a study tip!</div>`}${posts.length>=feedN?`<button class="btn o big" data-more>Load more</button>`:""}`,
group:()=>`<button class="btn big" data-newg>＋ Create study group (max 5)</button>${invCards()}<h2>Your groups</h2>${groups.map(grp).join("")||`<div class="card mut" style="text-align:center">👥<br>No groups yet. Add friends, then create one.</div>`}<div class="card" style="background:var(--soft)"><b>Private groups vs communities</b><p class="mut" style="margin-top:4px">Private groups are invite-only chats of up to 5 students. Public communities are open topic spaces anyone can join.</p></div>`,
profile:()=>profileCard()+`<h2>Quick settings</h2><div class="card row"><div class="grow"><b>Dark mode</b><span class="mut">Easier on the eyes</span></div><button class="btn o" data-theme>Toggle</button></div>`};
const res=()=>{const r=people.filter(p=>vis(p.uid)&&(p.username+p.name).toLowerCase().includes(q.toLowerCase()));return r.length?r.map(stu).join(""):`<div class="card mut" style="text-align:center">🔎<br>No students found.<br>Invite friends from the menu ☰</div>`};
const pages={
home:()=>`<div class="seg">${["global","group","profile"].map(t=>`<button class="${t===tab?"on":""}" data-tab="${t}">${{global:"🌍 Global",group:"👥 Group",profile:"👤 Profile"}[t]}</button>`).join("")}</div>${tabs[tab]()}`,
discover:()=>`<div class="card"><b>Add a friend by username</b><div class="row" style="margin-top:8px"><input id="fu" placeholder="@username" maxlength="21" autocapitalize="none" style="margin:0"><button class="btn" data-find>Find</button></div></div><div id="fres">${found?stu(found):""}</div><input id="q" placeholder="🔍 Search by name or username" value="${esc(q)}"><div id="res">${res()}</div>`,
chats:()=>`${reqIn.filter(r=>r.status==="pending"&&vis(r.from)).map(r=>`<div class="card row">${av(r.fromName)}<div class="grow"><b>${esc(r.fromName)}</b><span class="mut">wants to be friends</span></div><button class="btn" data-accept="${r.id}">Accept</button><button class="btn o" data-decline="${r.id}">✕</button></div>`).join("")}<h2>Conversations</h2>${friends.map(f=>`<div class="card row" data-chat="${f.uid}">${av(f.name)}<div class="grow"><b>${esc(f.name)}${unread[f.fid]?" 🔵":""}</b><p class="mut">@${esc(f.username)}</p></div><button class="ib" style="width:34px;height:34px" data-ua="${f.uid}" aria-label="More">⋮</button></div>`).join("")||`<div class="card mut" style="text-align:center">💬<br>Add friends in Discover to start chatting.</div>`}`,
groups:()=>`<button class="btn big" data-newg>＋ Create study group</button>${invCards()}<h2>Private groups (max 5)</h2>${groups.map(grp).join("")||`<div class="card mut">No private groups yet.</div>`}<h2>Public communities</h2>${COM.map(comCard).join("")}`,
profile:()=>profileCard()+`<h2>Settings</h2>`+[["🔒","Privacy settings","priv"],["🚫","Blocked students","blocked"],["🔔","Notification settings","nset"],["🚪","Log out","out"],["🗑","Delete account","del"]].map(x=>`<div class="card row" data-m="${x[2]}"><span style="font-size:20px">${x[0]}</span><b class="grow">${x[1]}</b><span class="mut">›</span></div>`).join("")+`<p class="mut" style="text-align:center;margin-top:8px">StudyConnect v0.8</p>`};
const navItems=[["home","🏠","Home"],["discover","🧭","Discover"],["chats","💬","Chats"],["groups","👥","Groups"],["profile","👤","Profile"]];
// ===== Rendering =====
function render(){if(!db.me){if(ready)authSheet();return}const nc=notifItems().filter(x=>!x.seen).length;$("bellb").innerHTML=nc?`<span>🔔<sup style="color:#e11d48;font-weight:700">${nc}</sup></span>`:"🔔";$("nav").innerHTML=navItems.map(n=>`<button class="${n[0]===page?"on":""}" data-p="${n[0]}"><span>${n[1]}</span>${n[2]}${(n[0]==="chats"&&(reqIn.some(r=>r.status==="pending"&&vis(r.from))||friends.some(f=>unread[f.fid])))||(n[0]==="groups"&&(gInv.some(v=>v.status==="pending")||groups.some(g=>unread[g.id])))?" 🔴":""}</button>`).join("");const sc=$("view").scrollTop;$("view").innerHTML=pages[page]();$("view").scrollTop=sc;const i=$("q");if(i)i.oninput=e=>{q=e.target.value;$("res").innerHTML=res()};
$("drawer").innerHTML=`<div class="row" style="padding:0 8px 14px">${av(db.me.name)}<div class="grow"><b>${esc(db.me.name)}</b><span class="mut">@${esc(db.me.user)}</span></div></div>`+[["👥","Friends","go:chats"],["✉️","Invite friends","invite"],["🔔","Notifications","notif"],["💬","Complaint / feedback","fb"],["📜","Community guidelines","guide"],["🛡️","Privacy & safety","priv"],["⚙️","Settings","go:profile"],["🌓","Dark / light mode","theme"],["🚪","Log out","out"]].map(x=>`<button data-m="${x[2]}"><span style="font-size:20px">${x[0]}</span>${x[1]}</button>`).join("")}

function shrink(f){return new Promise((ok,no)=>{const u=URL.createObjectURL(f),im=new Image();im.onload=()=>{URL.revokeObjectURL(u);for(const[mx,q]of[[1024,.7],[1024,.5],[800,.5],[640,.45],[480,.4]]){const k=Math.min(1,mx/Math.max(im.width,im.height)),c=document.createElement("canvas");c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);c.getContext("2d").drawImage(im,0,0,c.width,c.height);const d=c.toDataURL("image/jpeg",q);if(d.length<=380000)return ok(d)}ok(null)};im.onerror=()=>{URL.revokeObjectURL(u);no()};im.src=u})}
async function pickPic(f){if(!f)return;if(!/^image\//.test(f.type))return toast("Please choose an image");toast("Preparing photo…");try{const d=await shrink(f);if(!d)return toast("That photo is too large. Try another.");if(confirm("Send this photo?"))await sendMsg("",d)}catch(e){toast("Couldn’t read that photo.")}}
function viewImg(id){const m=chatMsgs[id];if(m&&okImg(m.img))sheet(`<img src="${m.img}" alt="Photo" style="width:100%;border-radius:14px"><button class="btn o big" data-close style="margin-top:12px">Close</button>`)}
function editPost(id){const p=posts.find(x=>x.id===id);if(!p)return;sheet(`<h2>Edit post</h2><textarea id="ep" rows="4" maxlength="500">${esc(p.text)}</textarea><button class="btn big" data-saveep="${id}">Save</button><button class="btn o big" data-close>Cancel</button>`)}
async function saveEdit(id){const t=$("ep").value.trim();if(t.length<3)return toast("Write a little more");try{await updateDoc(doc(fs,"posts",id),{text:t,edited:true});closeAll();toast("Post updated")}catch(e){toast("Couldn’t save. Try again.")}}
function fbSheet(){sheet(`<h2>Complaint or feedback</h2><select id="fc"><option>Complaint</option><option>Bug</option><option>Suggestion</option><option>Other</option></select><textarea id="ft" rows="4" maxlength="1000" placeholder="Tell us what happened…"></textarea><button class="btn big" data-sendfb>Send</button><button class="btn o big" data-close>Cancel</button>`)}
async function sendFb(){const t=$("ft").value.trim();if(t.length<5)return toast("Please write a little more");if(A.fb)return;A.fb=1;try{await setDoc(doc(fs,"feedback",U.uid+"_"+Date.now()),{from:U.uid,category:$("fc").value,text:t,createdAt:serverTimestamp()});closeAll();toast("Sent. Thank you!")}catch(e){toast("Couldn’t send. Try again.")}A.fb=0}
let lastRead={},seen=new Set();try{lastRead=JSON.parse(localStorage.getItem("sc-lr")||"{}");seen=new Set(JSON.parse(localStorage.getItem("sc-seen")||"[]"))}catch(e){}
const ns=()=>{try{return{msg:true,req:true,...JSON.parse(localStorage.getItem("sc-ns")||"{}")}}catch(e){return{msg:true,req:true}}};
const lsSet=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}};
function curId(){if(!ctx)return null;if(ctx.t==="d"){const f=friends.find(x=>x.uid===chatKey);return f&&f.fid}return ctx.t==="g"?ctx.id:null}
function markRead(ts=0){const id=curId();if(!id)return;lastRead[id]=Math.max(Date.now(),ts);unread[id]=false;lsSet("sc-lr",lastRead)}
function wc(){if(!U)return;const L=[...friends.map(f=>[f.fid,collection(fs,"friendships",f.fid,"messages")]),...groups.map(g=>[g.id,collection(fs,"groups",g.id,"messages")])].slice(0,40),k=L.map(x=>x[0]).join();if(k===chatsKey)return;chatUn.forEach(f=>f());chatsKey=k;L.forEach(([id])=>{if(lastRead[id]===undefined)lastRead[id]=Date.now()});lsSet("sc-lr",lastRead);chatUn=L.map(([id,c])=>onSnapshot(query(c,orderBy("createdAt","desc"),limit(1)),s=>{const d=s.docs[0];if(!d)return;const m=d.data(),t=m.createdAt?m.createdAt.toMillis():Date.now();unread[id]=m.from!==U.uid&&t>(lastRead[id]||0);if(!(ctx&&curId()===id))ref()},()=>{}))}
function notifItems(){const o=ns(),a=[];if(o.req){reqIn.filter(r=>r.status==="pending"&&vis(r.from)).forEach(r=>a.push({id:"rq"+r.id,t:`${esc(r.fromName)} sent you a friend request`,b:`<button class="btn" data-accept="${r.id}">Accept</button>`}));reqOut.filter(r=>r.status==="accepted").forEach(r=>a.push({id:"ra"+r.id,t:`${esc(nm(r.to))} accepted your friend request`,seen:seen.has("ra"+r.id)}));gInv.filter(v=>v.status==="pending"&&vis(v.from)).forEach(v=>a.push({id:"gi"+v.id,t:`${esc(v.fromName)} invited you to ${esc(v.groupName)}`,b:`<button class="btn" data-accinv="${v.id}">Join</button>`}));gOut.filter(v=>v.status==="accepted").forEach(v=>a.push({id:"ga"+v.id,t:`${esc(nm(v.to))} joined ${esc(v.groupName)}`,seen:seen.has("ga"+v.id)}))}if(o.msg){friends.filter(f=>unread[f.fid]).forEach(f=>a.push({id:"um"+f.fid,t:`New message from ${esc(f.name)}`,b:`<button class="btn o" data-chat="${f.uid}">Open</button>`}));groups.filter(g=>unread[g.id]).forEach(g=>a.push({id:"ug"+g.id,t:`New message in ${esc(g.name)}`,b:`<button class="btn o" data-og="${g.id}">Open</button>`}))}return a}
function bellSheet(){const l=notifItems();sheet(`<h2>Notifications</h2>${l.length?l.map(x=>`<div class="row" style="padding:8px 0;${x.seen?"opacity:.55":""}"><div class="grow" style="white-space:normal">${x.t}</div>${x.b||""}</div>`).join(""):`<p class="mut">You’re all caught up 🎉</p>`}<button class="btn o big" data-markall style="margin-top:10px">Mark all as read</button><button class="btn o big" data-close>Close</button>`)}
function markAll(){notifItems().forEach(x=>{if(!x.b)seen.add(x.id)});lsSet("sc-seen",[...seen]);friends.forEach(f=>{lastRead[f.fid]=Date.now();unread[f.fid]=false});groups.forEach(g=>{lastRead[g.id]=Date.now();unread[g.id]=false});lsSet("sc-lr",lastRead);closeAll();render()}
function nsetSheet(){const o=ns();sheet(`<h2>Notification settings</h2><label><input type="checkbox" id="ns1" ${o.msg?"checked":""}> New messages</label><label><input type="checkbox" id="ns2" ${o.req?"checked":""}> Friend requests, group invites and accepts</label><p class="mut" style="margin:8px 0">These alerts show inside the app. Alerts while the app is closed (push) need an extra setup later.</p><button class="btn big" data-nsave>Save</button><button class="btn o big" data-close>Cancel</button>`)}
function nsave(){lsSet("sc-ns",{msg:$("ns1").checked,req:$("ns2").checked});closeAll();render();toast("Saved")}

const A={
async signup(){const n=$("an").value.trim(),u=$("au").value.trim().toLowerCase(),e=$("ae").value.trim(),p=$("ap").value;if(n.length<2)return toast("Enter your display name");if(!/^[a-z0-9_]{3,20}$/.test(u))return toast("Username: 3–20 letters, numbers or _");if(!/^\S+@\S+\.\S+$/.test(e))return toast("Enter a valid email");if(p.length<8)return toast("Password needs at least 8 characters");if(!$("at").checked)return toast("Please accept the Terms and Privacy Policy");if(A.su)return;A.su=1;let c;
try{c=await createUserWithEmailAndPassword(auth,e,p)}catch(x){A.su=0;return toast(authErr(x))}
let st=1;try{await setDoc(doc(fs,"usernames",u),{uid:c.user.uid});st=2;await setDoc(doc(fs,"users",c.user.uid),{name:n,username:u,country:$("ac").value.trim(),bio:"",discoverable:true,createdAt:serverTimestamp()})}catch(x){try{await deleteDoc(doc(fs,"usernames",u))}catch(_){}try{await deleteUser(c.user)}catch(_){}A.su=0;return toast(st===1?"That username is already taken. Choose another.":"Couldn’t create your profile. Try again.")}
A.su=0;await begin(c.user)},
async login(){const e=$("ae").value.trim(),p=$("ap").value;if(!e||!p)return toast("Enter your email and password");if(A.li)return;A.li=1;try{await signInWithEmailAndPassword(auth,e,p)}catch(x){toast(authErr(x))}A.li=0},
async reset(){const e=$("ae").value.trim();if(!e)return toast("Type your email first");try{await sendPasswordResetEmail(auth,e);toast("If that email has an account, a reset link was sent")}catch(x){toast(authErr(x))}},
mode(){mode=mode==="up"?"in":"up";$("sheet").classList.remove("on");authSheet()},
edit(){const m=db.me;sheet(`<h2>Edit profile</h2><input id="en" value="${esc(m.name)}" maxlength="30"><input id="ec" value="${esc(m.country||"")}" placeholder="Country (optional)" maxlength="30"><textarea id="eb" rows="3" maxlength="160" placeholder="Short bio">${esc(m.bio||"")}</textarea><p class="mut" style="margin-bottom:8px">Username: @${esc(m.user)} (can’t be changed)</p><label><input type="checkbox" id="ed" ${m.discoverable!==false?"checked":""}> Show me in Discover</label><button class="btn big" data-saveedit>Save</button><button class="btn o big" data-close>Cancel</button>`)},
async saveedit(){const n=$("en").value.trim();if(n.length<2)return toast("Name is too short");const d={name:n,country:$("ec").value.trim(),bio:$("eb").value.trim(),discoverable:$("ed").checked};try{await updateDoc(doc(fs,"users",U.uid),d);Object.assign(db.me,d);closeAll();render();toast("Profile updated")}catch(e){toast(e.code==="permission-denied"?"Not allowed by Firebase rules. Check your Firestore rules.":"Couldn’t save. Check your connection and try again.")}},
async post(){const t=$("pt").value.trim();if(t.length<3)return toast("Write a little more");if(A.pp)return;if(Date.now()-(A.pt||0)<8000)return toast("Please wait a few seconds between posts");A.pp=1;try{await addDoc(collection(fs,"posts"),{from:U.uid,text:t,sub:$("ps").value,likedBy:[],expireAt:Timestamp.fromMillis(Date.now()+864e5),createdAt:serverTimestamp()});A.pt=Date.now();$("pt").value="";toast("Posted")}catch(e){toast("Couldn’t post. Try again.")}A.pp=0},
async mkg(){const n=$("gn").value.trim(),m=[...document.querySelectorAll(".gm:checked")].map(x=>x.value);if(n.length<2)return toast("Name your group");if(m.length>4)return toast("Max 5 members including you. Pick up to 4.");if(A.mg)return;A.mg=1;try{const r=await addDoc(collection(fs,"groups"),{name:n,sub:$("gs").value,owner:U.uid,members:[U.uid],createdAt:serverTimestamp()});for(const to of m){try{await sendInvite(r.id,n,to)}catch(e){}}closeAll();toast("Group created"+(m.length?" · invites sent":""))}catch(e){toast("Couldn’t create the group. Try again.")}A.mg=0},
back(){$("chat").classList.remove("on");chatKey=null;ctx=null;unChat&&unChat();unChat=null;render()},
send,sendrep:sendRep,find:findUser,close:()=>closeAll(),theme,newg:groupSheet,ginfo,delg:delGroup,leave:leaveGroup,ren:renGroup};
const M={fb(){fbSheet()},notif(){bellSheet()},nset(){nsetSheet()},blocked(){info("Blocked students",blocks.length?blocks.map(b=>`<div class="row" style="padding:6px 0"><b class="grow">${esc(b.blockedName||"Student")}</b><button class="btn o" data-unblock="${b.blocked}">Unblock</button></div>`).join(""):`<p class="mut">You haven’t blocked anyone.</p>`)},out(){if(confirm("Log out?"))signOut(auth)},async del(){if(!confirm("Delete your account and profile? This cannot be undone."))return;const cu=auth.currentUser;if(Date.now()-new Date(cu.metadata.lastSignInTime)>3e5)return toast("For security, log out, log in again, then delete within 5 minutes.");try{await deleteDoc(doc(fs,"users",cu.uid));await deleteDoc(doc(fs,"usernames",db.me.user));await deleteUser(cu);toast("Account deleted")}catch(e){toast("Couldn’t finish deleting. Log in again and retry.")}},
invite(){const l=location.href.split("#")[0],t="Join me on StudyConnect: "+l;closeAll();if(navigator.share)navigator.share({title:"StudyConnect",text:t}).catch(()=>{});else if(navigator.clipboard)navigator.clipboard.writeText(t).then(()=>toast("Invite link copied"),()=>toast("Copy failed"));else toast("Sharing not supported here")},
guide(){info("Community guidelines","<p>• Be kind and respectful.<br>• No bullying, hate or harassment.<br>• No sharing private info (address, phone, exact school).<br>• Keep content educational and age-appropriate.<br>• Report anything that feels unsafe. Reports are reviewed by moderators.</p>")},
priv(){info("Privacy & safety","<p>• Your email is never shown to other students.<br>• Profiles, friend requests and chats are stored in Firebase (Google). Messages and photos are not end-to-end encrypted.<br>• You can block and report students and messages. The app owner reviews reports manually. A reported message’s text is saved with the report. Feed posts are device-only samples.</p>")},theme};

if(t.id==="menuBtn"){$("drawer").classList.add("on");$("scrim").classList.add("on");return}

if(d.add)return sendReq(d.add);if(d.accept)return acceptReq(d.accept);if(d.decline)return declineReq(d.decline);if(d.ua)return userSheet(d.ua);if(d.ru)return reportSheet("user",d.ru);if(d.rm)return reportMsg(d.rm);if(d.bu)return blockUser(d.bu);if(d.uf)return unfriend(d.uf);if(d.unblock)return unblock(d.unblock);
if(d.like)return likePost(d.like);if(d.delp)return delPost(d.delp);if(d.rep)return reportPost(d.rep);if(d.cm)return openComments(d.cm);if(d.sendc)return sendComment(d.sendc);if(d.delc)return delComment(d.delc);if(d.repc)return reportComment(d.repc);if(d.dm)return delMsg(d.dm);if(d.more){feedN+=30;feed();return}if(d.pic!==undefined)return $("pf").click();if(d.view)return viewImg(d.view);if(d.editp)return editPost(d.editp);if(d.saveep)return saveEdit(d.saveep);if(d.markall!==undefined)return markAll();if(d.nsave!==undefined)return nsave();if(d.sendfb!==undefined)return sendFb();
if(d.join)return joinComm(d.join,1);if(d.leavec)return joinComm(d.leavec,0);if(d.og)return openGroup(d.og);if(d.oc)return openComm(d.oc);if(d.accinv)return accInv(d.accinv);if(d.decinv)return decInv(d.decinv);if(d.inv)return inviteUser(d.inv);if(d.rmm)return rmMember(d.rmm);if(d.rg){const g=groups.find(x=>x.id===(ctx&&ctx.id));return reportSheet("group",ctx.id,"",g?g.name:"",ctx.id)}

for(const k of Object.keys(d)){if(A[k])return A[k]()}});
